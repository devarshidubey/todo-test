version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo_test:latest
    container_name: my_django_app
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./src/rest/:/app  # mount code so changes are reflected immediately

  db:
    image: postgres:15
    container_name: my_postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A rest worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod

  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
